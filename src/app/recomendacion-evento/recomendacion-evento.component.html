<ion-content class="p-4 font-sans">
  <!-- Sección de prendas -->
  <div class="flex justify-between gap-3">
    <!-- Prenda Superior -->
    <ion-card class="w-1/2 rounded-2xl shadow-md">
      <ion-card-header class="text-center text-sm font-semibold text-[color:--ion-text-color]">
        Prenda Superior
      </ion-card-header>
      <ion-card-content class="flex flex-col items-center">
        <ion-icon name="image-outline" class="text-3xl text-gray-400 mb-2"></ion-icon>
        <span class="text-gray-500 text-sm mb-2">Visualización Prenda</span>
        <div class="flex items-center justify-between border-t pt-2 w-full">
          <input type="text" placeholder="Nombre Prenda" class="w-full bg-transparent outline-none text-sm" disabled>
          <ion-button fill="clear" size="small" class="text-[color:--ion-icons-color]">
            <ion-icon slot="icon-only" name="refresh-outline"></ion-icon>
          </ion-button>
        </div>
      </ion-card-content>
    </ion-card>

    <!-- Prenda Inferior -->
    <ion-card class="w-1/2 rounded-2xl shadow-md">
      <ion-card-header class="text-center text-sm font-semibold text-[color:--ion-text-color]">
        Prenda Inferior
      </ion-card-header>
      <ion-card-content class="flex flex-col items-center">
        <ion-icon name="image-outline" class="text-3xl text-gray-400 mb-2"></ion-icon>
        <span class="text-gray-500 text-sm mb-2">Visualización Prenda</span>
        <div class="flex items-center justify-between border-t pt-2 w-full">
          <input type="text" placeholder="Nombre Prenda" class="w-full bg-transparent outline-none text-sm" disabled>
          <ion-button fill="clear" size="small" class="text-[color:--ion-icons-color]">
            <ion-icon slot="icon-only" name="refresh-outline"></ion-icon>
          </ion-button>
        </div>
      </ion-card-content>
    </ion-card>
  </div>

  <!-- Subir foto -->
  <div class="mt-6">
    <h2 class="text-base font-semibold mb-1">Subir Foto</h2>
    <p class="text-sm text-gray-500 mb-3">Carga una imagen para visualizar como te quedaría este vestuario.</p>

    <ion-card class="rounded-2xl shadow-md flex items-center justify-center h-36">
      <ion-card-content class="flex flex-col items-center justify-center h-full">
        <ion-icon name="image-outline" class="text-3xl text-gray-400 mb-2"></ion-icon>
        <span class="text-gray-500 text-sm">Subir foto de cuerpo completo</span>
      </ion-card-content>
    </ion-card>
  </div>

  <!-- Botón de acción -->
  <button class="mt-4 w-full bg-[#E39D7C] hover:bg-[#C48465] text-white font-semibold py-2 px-4 rounded-full transition duration-300 flex items-center justify-center"
    (click)="irAtabVisualizacion()">
    <img class="w-6 h-6 mr-2" src="https://img.icons8.com/stamp/32/FFFFFF/t-shirt-on-hanger.png" alt="t-shirt-on-hanger"/>
    Generar Visualización
  </button>

</ion-content>
