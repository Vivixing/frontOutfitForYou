<ion-content class="flex flex-col items-center justify-start p-4">
  <!--Contenedor del card-->
  <div class="flex justify-center items-center mb-4">
    <ion-card class="rounded-2xl p-4 flex flex-col items-center relative w-48">
      <!-- Imagen de la prenda -->
      <img src="https://elaco.vtexassets.com/arquivos/ids/731899/Newfits-AZULINDIGO-N740260-1.jpg?v=638599543335400000" alt="Pantalón" class="w-full mb-4"/>

      <!-- Círculo de color arriba a la derecha -->
      <div class="absolute top-4 right-4 w-6 h-6 rounded-full border-4 border-[#E39D7C] bg-[#0D0B33]"></div>
    </ion-card>
  </div>

  <!-- Selector categoría -->
  <ion-select interface="action-sheet" placeholder="Seleccionar categoría" class="w-full border border-[#E39D7C] rounded-md p-2 mb-4">
    <ion-select-option value="Camisa">Superior</ion-select-option>
    <ion-select-option value="Pantalón">Inferior</ion-select-option>
  </ion-select>

  <!-- Campo nombre -->
  <ion-input placeholder="Nombre Prenda" class="w-full border border-[#E39D7C] rounded-md mb-4" style="--padding-start: 0.75rem;" ></ion-input>

  <!-- Botones -->
  <div class="flex w-full justify-between">
    <button class="w-[48%] border border-[#E39D7C] rounded-full py-2 text-[#E39D7C] flex items-center justify-center" (click)="borrarCampos()">
      <ion-icon class="w-5 h-5 mr-1" name="trash-outline"></ion-icon>
      Borrar
    </button>
    <button class="w-[48%] bg-[#E39D7C] rounded-full py-2 text-white flex items-center justify-center" (click)="editarPrenda()">
      <ion-icon  class="w-5 h-5 mr-1" name="create-outline"></ion-icon>
      Editar
    </button>
  </div>
</ion-content>
