<div class="w-full max-w-4xl mx-auto p-4 sm:p-6 lg:p-8">

  <h2 class="text-3xl sm:text-4xl font-extrabold mb-8 text-center">
    Tu Clóset
  </h2>

  @if (prendasFiltradas.length > 0) {
  <div class="flex items-center justify-center gap-6 mb-10">

    <div class="flex flex-col items-center cursor-pointer group" (click)="onAplicarFiltro()">
      <div
        class="w-16 h-16 bg-[#FBEFEA] rounded-full flex items-center justify-center transition-colors group-hover:bg-[#EAB69E]">
        <ion-icon name="eye-outline" class="w-8 h-8 text-[#BBAAA0] group-hover:text-[#735E51]"></ion-icon>
      </div>
      <span class="mt-2 text-sm font-medium text-[#BBAAA0] group-hover:text-[#735E51]">Todo</span>
    </div>

    <div class="flex flex-col items-center cursor-pointer group" (click)="onAplicarFiltro('Superior')">
      <div
        class="w-16 h-16 bg-[#FBEFEA] rounded-full flex items-center justify-center transition-colors group-hover:bg-[#EAB69E]">
        <ion-icon name="shirt-outline" class="w-8 h-8 text-[#BBAAA0] group-hover:text-[#735E51]"></ion-icon>
      </div>
      <span class="mt-2 text-sm font-medium text-[#BBAAA0] group-hover:text-[#735E51]">Superior</span>
    </div>

    <div class="flex flex-col items-center cursor-pointer group" (click)="onAplicarFiltro('Inferior')">
      <div
        class="w-16 h-16 bg-[#FBEFEA] rounded-full flex items-center justify-center transition-colors group-hover:bg-[#EAB69E]">
        <img class="w-9 h-9 opacity-30 group-hover:opacity-60" src="https://img.icons8.com/ios/100/trousers.png"
          alt="trousers" />
      </div>
      <span class="mt-2 text-sm font-medium text-[#BBAAA0] group-hover:text-[#735E51]">Inferior</span>
    </div>
  </div>
  }

  @if (prendasFiltradas.length > 0) {

  <!-- Loading skeleton -->
  <div *ngIf="isLoading" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6 animate-pulse">
    <div *ngFor="let i of skeletonArray" class="bg-white rounded-2xl shadow-md p-4 relative">

      <!-- Imagen -->
      <div class="w-full h-32 flex items-center justify-center mb-2">
        <div class="w-20 h-20 bg-gray-200 rounded-md"></div>
      </div>

      <!-- Círculo de color (fake) -->
      <div class="w-5 h-5 rounded-full absolute top-4 right-4 border-2 border-gray-200 bg-gray-200"></div>

      <!-- Nombre -->
      <div class="pt-2 border-t border-gray-100">
        <div class="h-4 bg-gray-200 rounded w-3/4 mx-auto"></div>
      </div>

      <!-- Botones -->
      <div class="flex justify-center gap-6 mt-4">
        <div class="w-6 h-6 bg-gray-200 rounded-full"></div>
        <div class="w-6 h-6 bg-gray-200 rounded-full"></div>
      </div>
    </div>
  </div>

  <div *ngIf="!isLoading" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
    <div *ngFor="let prenda of prendasFiltradas"
      class="bg-white rounded-2xl shadow-md p-4 relative transform transition-all duration-200 hover:scale-[1.02]">

      <div class="w-full h-32 flex items-center justify-center mb-2">
        <img [src]="'data:image/jpeg;base64,' + prenda.imagen" alt="{{ prenda.nombre }}"
          class="max-w-full max-h-full object-contain" loading="lazy" />
      </div>

      <div *ngIf="isHexColorValido(prenda.color)"
        class="w-5 h-5 rounded-full absolute top-4 right-4 border-2 border-gray-200 shadow-sm"
        [ngStyle]="{ 'background-color': prenda.color }"></div>

      <div class="pt-2 border-t border-gray-100">
        <p class="text-sm font-semibold text-center text-[#735E51]">{{ prenda.nombre }}</p>
      </div>

      <div class="flex justify-center gap-6 mt-4">
        <button (click)="irAtabEditarPrenda(prenda._id)" class="text-[#EAB69E] hover:text-[#735E51] transition-colors">
          <ion-icon name="create-outline" class="w-6 h-6"></ion-icon>
        </button>
        <button (click)="onEliminarPrenda(prenda._id)" class="text-[#EAB69E] hover:text-[#735E51] transition-colors">
          <ion-icon name="trash-outline" class="w-6 h-6"></ion-icon>
        </button>
      </div>
    </div>
  </div>
  }

  @if (!isLoading && prendasFiltradas.length === 0) {
  <div
    class="w-full flex flex-col items-center justify-center p-8 sm:p-12 bg-white rounded-3xl shadow-lg border border-gray-100">

    <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 text-red-400 mb-6" fill="none" viewBox="0 0 24 24"
      stroke="currentColor">
      <rect x="4" y="3" width="16" height="18" rx="2" ry="2" stroke-width="2"></rect>
      <line x1="12" y1="3" x2="12" y2="21" stroke-width="2"></line>
      <circle cx="9" cy="12" r="0.8" fill="currentColor"></circle>
      <circle cx="15" cy="12" r="0.8" fill="currentColor"></circle>
    </svg>

    <p class="text-center text-lg sm:text-xl text-gray-600 font-medium mb-2">
      Aún no hay prendas en tu clóset.
    </p>
    <p class="text-center text-sm text-gray-400 mb-6">
      ¡Comienza agregando tus primeras prendas para armar tus outfits!
    </p>

    <button (click)="irAtabAgregarPrenda()"
      class="mt-4 w-full py-3 bg-[#F4CFA6] text-brown-700 font-semibold rounded-full shadow-lg transition hover:bg-[#e0b98f] focus:outline-none focus:ring-2 focus:ring-[#e0b98f] focus:ring-offset-2">
      <span class="flex items-center justify-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        Agregar una prenda
      </span>
    </button>
  </div>
  }
</div>
