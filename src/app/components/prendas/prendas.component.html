<div class="p-6 min-h-screen">
  <!-- Título -->
  <h2 class="text-xl font-semibold mb-4">Categorías</h2>

  <!-- Filtros -->
  <div class="flex items-center gap-6 mb-6">
    <!-- Filtro -->
    <div class="flex flex-col items-center text-sm ">
      <div class="w-12 h-12 bg-[color:--ion-icons-bg-40] hover:bg-[color:--ion-icons-bg-60] rounded-full flex items-center justify-center">
        <!-- Ícono (ojo - ver todo) -->
        <ion-icon name="eye-outline" class="w-6 h-6 text-white"></ion-icon>
      </div>
      <span class="mt-1">Ver todo</span>
    </div>

    <!-- Filtro superior -->
    <div class="flex flex-col items-center text-sm">
      <div class="w-12 h-12 bg-[color:--ion-icons-bg-40] hover:bg-[color:--ion-icons-bg-60] rounded-full flex items-center justify-center">
        <!-- Ícono de camiseta -->
        <ion-icon name="shirt-outline" class="w-6 h-6 text-white"></ion-icon>
      </div>
      <span class="mt-1">Superior</span>
    </div>

    <!-- Filtro inferior -->
    <div class="flex flex-col items-center text-sm">
      <div class="w-12 h-12 bg-[color:--ion-icons-bg-40] hover:bg-[color:--ion-icons-bg-60] rounded-full flex items-center justify-center">
        <!-- Ícono de pantalón -->
        <img class="w-7 h-7" src="https://img.icons8.com/ios/100/FFFFFF/trousers.png" alt="trousers"/>
      </div>
      <span class="mt-1">Inferior</span>
    </div>
  </div>

  <!-- Grilla de prendas -->
  <div class="grid grid-cols-2 gap-4">
    <!-- Card de prenda -->
    <div *ngFor="let prenda of prendas" class="bg-white rounded-xl shadow-md p-3 relative">
      <!-- Imagen del pantalón -->
      <img [src]="'data:image/jpeg;base64,' + prenda.imagen"  alt="{{ prenda.nombre }}" class="w-full h-32 object-contain mb-2" />

      <!-- Círculo de color en la esquina superior derecha -->
      <div *ngIf="isHexColorValido(prenda.color)" class="w-4 h-4 rounded-full absolute top-2 right-2 border-2 border-[color:--ion-icons-color]" [ngStyle]="{ 'background-color': prenda.color }"></div>

      <!-- Nombre del producto -->
      <p class="text-sm font-medium text-center border-t border-[color:--ion-icons-color] pt-1">{{ prenda.nombre }}</p>

      <!-- Iconos de editar y eliminar -->
      <div class="flex justify-center gap-4 mt-2">
        <!-- Icono de editar -->
        <button class="text-[color:--ion-icons-color] hover:text-[color:--ion-text-color]" (click)="irAtabEditarPrenda(prenda._id)">
          <ion-icon name="create-outline" class="w-5 h-5"></ion-icon>
        </button>

        <!-- Icono de eliminar -->
        <button class="text-[color:--ion-icons-color] hover:text-[color:--ion-text-color]">
          <ion-icon name="trash-outline" class="w-5 h-5"></ion-icon>
        </button>
      </div>
    </div>
  </div>

  <!-- Mostrar mensaje si no hay prendas -->
  <div *ngIf="prendas.length === 0" class="text-center mt-8 text-gray-500">
    No hay prendas registradas.
  </div>
  
</div>
