<div class="w-full max-w-xs p-4">
  <!-- Título principal -->
  <h1 class="text-2xl font-medium text-brown-700 leading-snug">
    Vestirte <strong class="font-bold">nunca</strong><br>
    fue tan <span class="text-[#F4CFA6] font-semibold italic">fácil!</span>
  </h1>

  <!-- Subtítulo -->
  <p class="mt-4 text-sm text-brown-500 font-medium">Recomendaciones recientes</p>

  <!-- Lista de visualizaciones -->
  <div class="mt-4 grid grid-cols-2 gap-4">
    <div *ngFor="let v of visualizaciones"
      class="bg-gray-100 rounded-xl p-4 shadow-sm flex flex-col items-center justify-center">

      <!-- Imagen -->
      <img [src]="'data:image/jpeg;base64,' + v.imagen" alt="visualización"
        class="w-20 h-20 object-cover rounded-lg mb-2" />

      <!-- Fecha -->
      <p class="text-[10px] text-gray-500 text-center">
        {{ v.fechaCreado | date:'short' }}
      </p>
    </div>
  </div>
</div>
