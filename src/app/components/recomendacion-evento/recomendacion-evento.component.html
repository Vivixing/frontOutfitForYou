<ion-content *ngIf="vestuarioSugerido?.data?.length > 0" class="font-sans">

  <div class="max-w-2xl mx-auto space-y-8 px-4 sm:px-6 md:px-8 py-6">

    <h1 class="text-2xl sm:text-3xl font-extrabold text-center">
      Tu conjunto ideal
    </h1>

    <!-- Tarjetas de prendas -->
    <div class="flex flex-row gap-4 sm:gap-6">
      <ion-card class="flex-1 min-w-0 rounded-2xl shadow-lg border border-gray-100 p-4">
        <ion-card-header class="text-center text-sm text-[#735E51] font-bold">
          Prenda Superior
        </ion-card-header>
        <ion-card-content class="flex flex-col items-center">
          <div class="w-full h-32 flex items-center justify-center mb-2">
            <img *ngIf="prendaSuperior?.imagen" [src]="'data:image/jpeg;base64,' + prendaSuperior.imagen" alt="Prenda superior" class="max-w-full max-h-full object-contain" />
          </div>
          <p class="text-center text-sm text-[#957A6A] font-medium mt-2">
            {{ prendaSuperior?.nombre }}
          </p>
        </ion-card-content>
      </ion-card>

      <ion-card class="flex-1 min-w-0 rounded-2xl shadow-lg border border-gray-100 p-4">
        <ion-card-header class="text-center text-sm font-bold text-[#735E51]">
          Prenda Inferior
        </ion-card-header>
        <ion-card-content class="flex flex-col items-center">
          <div class="w-full h-32 flex items-center justify-center mb-2">
            <img *ngIf="prendaInferior?.imagen" [src]="'data:image/jpg;base64,' + prendaInferior.imagen" alt="Prenda inferior" class="max-w-full max-h-full object-contain" />
          </div>
          <p class="text-center text-sm text-[#957A6A] font-medium mt-2">
            {{ prendaInferior?.nombre }}
          </p>
        </ion-card-content>
      </ion-card>
    </div>

    <!-- Tu foto -->
    <div class="mt-8">
      <h2 class="text-lg font-bold mb-1">Tu foto</h2>
      <p class="text-sm text-gray-500 mb-3">
        Sube una imagen de cuerpo completo para probarte el vestuario.
      </p>

      <ion-card class="rounded-2xl shadow-lg border border-gray-100 h-64 relative overflow-hidden cursor-pointer" (click)="fileInput.click()">
        <ion-card-content class="flex flex-col items-center justify-center h-full p-0">
          <img *ngIf="imagenUsuario" [src]="imagenUsuario" alt="Foto cuerpo completo" class="w-full h-full object-contain rounded-2xl"/>
          
          <ng-container *ngIf="!imagenUsuario">
            <ion-icon name="image-outline" class="text-5xl text-gray-400 mb-2"></ion-icon>
            <span class="text-gray-500 text-sm font-medium">Toca para subir tu foto</span>
          </ng-container>
        </ion-card-content>

        <input type="file" accept="image/png, image/jpeg" hidden #fileInput (change)="cargarImagenUsuario($event)"/>
      </ion-card>
    </div>

    <!-- Botón -->
    <ion-button expand="block" shape="round" class="mt-6 shadow-lg" (click)="irAtabVisualizacion()" [disabled]="!imagenUsuario">
      <ion-icon slot="start" name="sparkles-outline"></ion-icon>
      Generar Visualización
    </ion-button>
  </div>
</ion-content>
