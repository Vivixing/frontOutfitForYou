<!-- Avatar y nombre -->
<div class="flex flex-col items-center mt-6">
  <div class="w-24 h-24 rounded-full bg-[#FFEADF] shadow-md flex items-center justify-center mb-3">
    <ion-icon name="person-outline" class="text-5xl text-[#D6A77A] "></ion-icon>
  </div>
  <h2 class="text-xl font-semibold">{{ nombre }}</h2>
</div>

<!-- Opciones -->
<div class="mt-10 w-full max-w-sm bg-white rounded-2xl shadow-lg overflow-hidden">
  <div class="divide-y divide-gray-200">
    <button class="w-full p-4 flex items-center justify-between hover:bg-gray-50 active:bg-gray-100 transition"
      (click)="irAFavoritos()">
      <div class="flex items-center space-x-3">
        <ion-icon class="w-5 h-5 text-[#E39D7C]" name="heart-outline"></ion-icon>
        <span>Favoritos</span>
      </div>
      <ion-icon class="w-4 h-4 text-gray-400" name="chevron-forward-outline"></ion-icon>
    </button>

    <button class="w-full p-4 flex items-center justify-between hover:bg-gray-50 active:bg-gray-100 transition"
      (click)="alCerrarSesion()">
      <div class="flex items-center space-x-3">
        <ion-icon class="w-5 h-5 text-[#E39D7C]" name="log-out-outline"></ion-icon>
        <span>Cerrar Sesión</span>
      </div>
      <ion-icon class="w-4 h-4 text-gray-400" name="chevron-forward-outline"></ion-icon>
    </button>
  </div>
</div>
