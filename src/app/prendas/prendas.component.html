<div class="p-6 bg-white min-h-screen">
  <!-- Título -->
  <h2 class="text-xl font-semibold mb-4">Categorías</h2>

  <!-- Filtros -->
  <div class="flex items-center gap-6 mb-6">
    <!-- Filtro -->
    <div class="flex flex-col items-center text-sm ">
      <div class="w-12 h-12 bg-rose-100 rounded-full flex items-center justify-center">
        <!-- Ícono (ojo - ver todo) -->
        <ion-icon name="eye-outline" class="w-6 h-6"></ion-icon>
      </div>
      <span class="mt-1">Ver todo</span>
    </div>

    <!-- Filtro superior -->
    <div class="flex flex-col items-center text-sm">
      <div class="w-12 h-12 bg-rose-100 rounded-full flex items-center justify-center">
        <!-- Ícono de camiseta -->
        <ion-icon name="shirt-outline" class="w-6 h-6"></ion-icon>
      </div>
      <span class="mt-1">Superior</span>
    </div>

    <!-- Filtro inferior -->
    <div class="flex flex-col items-center text-sm">
      <div class="w-12 h-12 bg-rose-100 rounded-full flex items-center justify-center">
        <!-- Ícono de pantalón -->
      </div>
      <span class="mt-1">Inferior</span>
    </div>
  </div>

  <!-- Grilla de prendas -->
  <div class="grid grid-cols-2 gap-4">
    <!-- Card de prenda -->
    <div class="bg-white rounded-2xl shadow-sm p-3 relative">
      <!-- Imagen -->
      <img src="https://tse4.mm.bing.net/th?id=OIP.yDBB3ebZLGFuC2Qh4jc8tAHaHa&pid=Api&P=0&h=180" alt="Jean" class="w-full h-36 object-contain rounded-xl" />
      <!-- Botón de selección (círculo de color) -->
      <span class="absolute top-3 right-3 w-4 h-4 bg-blue-500 border-2 border-white rounded-full"></span>
      <!-- Nombre -->
      <p class="mt-2 text-center text-gray-800 text-sm">Jean</p>
      <!-- Acciones -->
      <div class="flex justify-center mt-1 gap-4 text-rose-400">
        <!-- Editar -->
        <button>
          <ion-icon name="create-outline" class="w-5 h-5"></ion-icon>
        </button>
        <!-- Eliminar -->
        <button>
          <ion-icon name="trash-outline" class="w-5 h-5"></ion-icon>
        </button>
      </div>
    </div>

    <!-- Duplicar esta tarjeta para más prendas -->
  </div>
</div>
