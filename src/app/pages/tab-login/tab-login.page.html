<ion-content class="ion-padding" [fullscreen]="true">
  <div class="h-full flex flex-col justify-center items-center">
    <div class="w-full max-w-sm text-center space-y-8">
      <div class="space-y-2">
        <h1 class="text-3xl font-bold">Iniciar Sesión</h1>
        <p>Inicia sesión para acceder a tu cuenta.</p>
      </div>

      <div class="space-y-5">
        <ion-item class="ion-no-padding" fill="outline" shape="round">
          <ion-label position="floating">Correo electrónico</ion-label>
          <ion-input type="email" [(ngModel)]="email"></ion-input>
        </ion-item>

        <ion-item class="ion-no-padding" fill="outline" shape="round">
          <ion-label position="floating">Contraseña</ion-label>
          <ion-input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="contrasena"></ion-input>
          <ion-icon slot="end" [name]="showPassword ? 'eye' : 'eye-off'" class="text-[color:--ion-text-bg-40]" (click)="togglePasswordVisibility()"></ion-icon>
        </ion-item>

      </div>

      <div class="space-y-4">
        <ion-button expand="block" shape="round" (click)="login()" [disabled]="!isFormValid()">
          Iniciar sesión
        </ion-button>
        
        <p class="text-sm">
          ¿No tienes una cuenta? 
          <a routerLink="/registro" class="text-[color:--ion-color-salmon] font-medium hover:underline">Regístrate</a>
        </p>
      </div>
      
    </div>
  </div>
</ion-content>
