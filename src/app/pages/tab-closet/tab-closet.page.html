<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-button slot="start" fill="clear" color="light" class="flex flex-col items-center text-sm" (click)="goBack()">
      <div class="w-10 h-10 bg-[color:--ion-icons-bg-70] rounded-full flex items-center justify-center">
        <ion-icon class="w-5 h-5" name="chevron-back-outline"></ion-icon>
      </div>
    </ion-button>
    <ion-title class="ion-text-center">Closet</ion-title>
    <button slot="end" class="flex flex-col items-center text-sm mr-4" (click)="irAtabAgregarPrenda()">
      <div class="w-10 h-10 bg-[color:--ion-icons-bg-70] rounded-full flex items-center justify-center">
        <ion-icon class="w-6 h-6 text-white" name="add-outline"></ion-icon>
      </div>
    </button>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <app-prendas 
  [prendas]="prendas" 
  [prendasFiltradas]="prendasFiltradas"
  (VerPrendaEvent)="cargarPrendas()"
  (aplicarFiltroCategoriaEvent)="aplicarFiltroCategoria($event)"
  (eliminarPrendaEvent)="eliminarPrenda($event)"

  [isLoading]="isLoading"></app-prendas>
</ion-content>
