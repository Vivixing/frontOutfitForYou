<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button fill="clear" color="light" (click)="goBack()">
        <div class="w-10 h-10 bg-[color:--ion-icons-bg-70] rounded-full flex items-center justify-center">
          <ion-icon class="w-5 h-5" name="chevron-back-outline"></ion-icon>
        </div>
      </ion-button>
    </ion-buttons>
    
    <ion-title class="text-lg font-semibold">Closet</ion-title>

    <ion-buttons slot="end" >
      <ion-button fill="clear" color="light" (click)="irAtabAgregarPrenda()">
        <div class="w-10 h-10 bg-[color:--ion-icons-bg-70] rounded-full flex items-center justify-center">
          <ion-icon class="w-6 h-6" name="add-outline"></ion-icon>
        </div>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <app-prendas [prendas]="prendas" [prendasFiltradas]="prendasFiltradas" (VerPrendaEvent)="cargarPrendas()"
    (aplicarFiltroCategoriaEvent)="aplicarFiltroCategoria($event)" (eliminarPrendaEvent)="eliminarPrenda($event)"
    [isLoading]="isLoading"></app-prendas>
</ion-content>
