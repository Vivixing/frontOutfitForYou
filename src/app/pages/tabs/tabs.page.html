<ion-tabs>

  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="tab1" href="/tabs/tab1">
      <ion-icon class="text-[color:--ion-icons-color] hover:text-[color:--ion-text-color]" name="home-outline"></ion-icon>
      <ion-label>Inicio</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab2" href="/tabs/tab2">
      <ion-icon class="text-[color:--ion-icons-color] hover:text-[color:--ion-text-color]" name="heart-outline"></ion-icon>
      <ion-label>Favorito</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab3" href="/tabs/tab3">
      <div class="w-12 h-12 bg-[color:--ion-icons-color] hover:bg-[color:--ion-text-color] rounded-full flex items-center justify-center">
        <img class="w-6 h-6" src="../../../assets/icon/ai-generated-image.svg" alt="ai-generated-image--v1" loading="lazy"/>
      </div>
    </ion-tab-button>

    <ion-tab-button class="group relative" tab="tabCloset" href="/tabs/tab-closet">
    <img class="w-6 h-6 block group-hover:hidden" src="../../../assets/icon/wardrobe.svg" alt="wardrobe" loading="lazy"/>
    <img class="w-6 h-6 hidden group-hover:block" src="../../../assets/icon/wardrobe.svg" alt="wardrobe hover" loading="lazy"/>      
    <ion-label>Closet</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tabPerfil" href="/tabs/tab-perfil">
      <ion-icon class="text-[color:--ion-icons-color] hover:text-[color:--ion-text-color]" name="person-outline"></ion-icon>
      <ion-label>Perfil</ion-label>
    </ion-tab-button>
  </ion-tab-bar>

</ion-tabs>
