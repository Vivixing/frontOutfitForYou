<ion-header [translucent]="true" class="ion-no-border">

  <ion-toolbar>

    <ion-buttons slot="start">
      <ion-button  fill="clear" color="light" (click)="goBack()">
        <div class="w-10 h-10 bg-[color:--ion-icons-bg-70] rounded-full flex items-center justify-center">
          <ion-icon class="w-5 h-5" name="chevron-back-outline"></ion-icon>
        </div>
      </ion-button>
    </ion-buttons>

    <ion-title class="text-lg font-semibold">Recomendación</ion-title>

  </ion-toolbar>

</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <app-recomendacion-evento 
    [vestuarioSugerido]="vestuarioSugerido" 
    [imagenUsuario]="imagenUsuario"
    (capturarImagenUsuarioEvent)="seleccionarArchivo($event)">
  </app-recomendacion-evento>
</ion-content>
