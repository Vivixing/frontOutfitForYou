<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" [fullscreen]="true">
  <div class="h-full flex flex-col justify-center items-center">
    <div class="w-full max-w-sm text-center space-y-8">

      <div class="space-y-2">
        <h1 class="text-3xl font-bold">Crea tu cuenta</h1>
        <p>Completa con tus datos y regístrate.</p>
      </div>

      <div class="space-y-5">
        <ion-item class="ion-no-padding" fill="outline" shape="round">
          <ion-label position="floating">Nombre completo</ion-label>
          <ion-input type="text" [(ngModel)]="nombre"></ion-input>
        </ion-item>

        <ion-item class="ion-no-padding" fill="outline" shape="round">
          <ion-label position="floating">Correo electrónico</ion-label>
          <ion-input type="email" [(ngModel)]="email" autocomplete="email"></ion-input>
        </ion-item>

        <ion-item class="ion-no-padding" fill="outline" shape="round">
          <ion-label position="floating">Contraseña</ion-label>
          <ion-input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="contrasena" autocomplete="current-password"></ion-input>
          <ion-icon slot="end" [name]="showPassword ? 'eye' : 'eye-off'" class="text-[color:--ion-text-bg-40]"
            (click)="togglePasswordVisibility()">
          </ion-icon>
        </ion-item>
      </div>

      <div class="space-y-4">
        <ion-button expand="block" shape="round" (click)="crearUsuario()" [disabled]="!isFormValid()">
          Crear cuenta
        </ion-button>

        <p class="text-sm">
          ¿Ya tienes una cuenta?
          <a routerLink="/login" class="text-[color:--ion-color-salmon] font-medium hover:underline">Iniciar sesión</a>
        </p>
      </div>

    </div>
  </div>
</ion-content>
